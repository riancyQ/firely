<!DOCTYPE html>
<html>
<head>
  <title>Test</title>
  <script src="./js/localStorageService.js"></script>
  <script src="./js/frontendService.js"></script>
</head>
<body>
  <div id="welcome-modal" style="display: flex;">
    <h3>Welcome</h3>
    <input type="number" id="welcome-annual-income" value="10">
    <input type="number" id="welcome-annual-expense" value="5">
    <select id="welcome-risk-profile">
      <option value="conservative">保守</option>
    </select>
    <button onclick="window.saveUserInfo()">确认</button>
    <button onclick="window.skipWelcome()">跳过</button>
  </div>
  
  <script>
    console.log('Test script started');
    
    let userGender = 'male';
    let userAnnualIncome = 0;
    let userAnnualExpense = 50000;
    let userRiskProfile = '';
    
    window.skipWelcome = function() {
      console.log('skipWelcome called');
      window.frontendService.saveUserInfo({
        gender: 'male',
        annualIncome: 100000,
        annualExpense: 50000,
        riskProfile: 'moderate'
      });
      document.getElementById('welcome-modal').style.display = 'none';
      alert('跳过成功');
    };
    
    window.saveUserInfo = async function() {
      console.log('saveUserInfo called');
      const income = parseFloat(document.getElementById('welcome-annual-income').value);
      const expense = parseFloat(document.getElementById('welcome-annual-expense').value);
      const risk = document.getElementById('welcome-risk-profile').value;
      
      window.frontendService.saveUserInfo({
        gender: 'male',
        annualIncome: income * 10000,
        annualExpense: expense * 10000,
        riskProfile: risk
      });
      
      document.getElementById('welcome-modal').style.display = 'none';
      alert('保存成功');
    };
    
    console.log('Test script completed');
    console.log('window.saveUserInfo:', typeof window.saveUserInfo);
    console.log('window.skipWelcome:', typeof window.skipWelcome);
  </script>
</body>
</html>
