<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>家庭理财 Agent - 钱多多</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 30px;
    }

    h1 {
      color: white;
      font-size: 2.5rem;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
      margin: 0;
    }

    .btn-settings {
      background: rgba(255,255,255,0.2);
      border: none;
      font-size: 1.8rem;
      cursor: pointer;
      padding: 10px 15px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }

    .btn-settings:hover {
      background: rgba(255,255,255,0.3);
      transform: scale(1.1);
    }

    .toolbar {
      display: flex;
      gap: 10px;
    }

    .dashboard {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    
    .fire-section {
      grid-column: 1 / -1;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    .card-title {
      font-size: 1rem;
      color: #666;
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .card-value {
      font-size: 2.5rem;
      font-weight: 700;
    }

    .card-value.income { color: #22c55e; }
    .card-value.expense { color: #ef4444; }
    .card-value.balance { color: #3b82f6; }

    .health-section {
      grid-column: span 1;
      text-align: center;
    }

    .health-light {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      margin: 0 auto 20px;
      box-shadow: 0 0 30px currentColor, inset 0 0 20px rgba(255,255,255,0.3);
      transition: all 0.3s ease;
    }

    .health-light.healthy { background-color: #22c55e; color: #22c55e; }
    .health-light.warning { background-color: #eab308; color: #eab308; }
    .health-light.danger { background-color: #ef4444; color: #ef4444; }

    .health-status {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 8px;
    }

    .health-message {
      color: #666;
      font-size: 0.9rem;
    }

    .savings-rate {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid #eee;
    }

    .savings-rate span {
      font-size: 1.5rem;
      font-weight: 700;
      color: #8b5cf6;
    }

    .tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 20px;
    }

    .tab {
      padding: 12px 24px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab.active {
      background: white;
      color: #667eea;
    }

    .tab:not(.active) {
      background: rgba(255,255,255,0.2);
      color: white;
    }

    .tab:hover:not(.active) {
      background: rgba(255,255,255,0.3);
    }

    .transaction-section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
    }

    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      color: #333;
    }

    .btn-add {
      padding: 10px 20px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
      font-weight: 600;
      transition: transform 0.2s ease;
    }

    .btn-add:hover {
      transform: translateY(-2px);
    }

    .transaction-list {
      max-height: 400px;
      overflow-y: auto;
    }

    .transaction-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px;
      border-bottom: 1px solid #eee;
      transition: background-color 0.2s ease;
    }

    .transaction-item:hover {
      background-color: #f8fafc;
    }

    .transaction-item:last-child {
      border-bottom: none;
    }

    .month-section {
      margin-bottom: 16px;
    }

    .month-header {
      font-size: 1rem;
      font-weight: 600;
      color: #64748b;
      padding: 8px 16px;
      margin-bottom: 8px;
      border-left: 3px solid #667eea;
    }

    .transaction-info {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .transaction-category {
      font-weight: 600;
      color: #333;
    }

    .transaction-description {
      font-size: 0.85rem;
      color: #666;
    }

    .transaction-date {
      font-size: 0.8rem;
      color: #999;
    }

    .transaction-amount {
      font-size: 1.2rem;
      font-weight: 700;
    }

    .transaction-amount.income { color: #22c55e; }
    .transaction-amount.expense { color: #ef4444; }

    .chart-section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.08);
    }

    .chart-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
      gap: 16px;
    }

    .chart-header h3 {
      font-size: 1.25rem;
      font-weight: 600;
      color: #333;
      margin: 0;
    }

    .growth-summary {
      display: flex;
      gap: 24px;
    }

    .growth-item {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
    }

    .growth-label {
      font-size: 0.75rem;
      color: #999;
      margin-bottom: 4px;
    }

    .growth-value {
      font-size: 1.1rem;
      font-weight: 700;
    }

    .growth-value.positive { color: #10b981; }
    .growth-value.negative { color: #ef4444; }

    .pie-chart-container {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: 20px 0;
    }

    .pie-chart {
      width: 280px;
      height: 280px;
      transition: transform 0.3s ease;
    }

    .pie-chart:hover {
      transform: scale(1.05);
    }

    .pie-slice {
      cursor: pointer;
      transition: opacity 0.3s ease;
    }

    .pie-slice:hover {
      opacity: 0.8;
    }

    .pie-legend {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 24px;
      padding-top: 20px;
      border-top: 1px solid #eee;
    }

    .pie-legend-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #f8fafc;
      border-radius: 8px;
    }

    .pie-legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
      margin-right: 12px;
      flex-shrink: 0;
    }

    .pie-legend-text {
      flex: 1;
      text-align: left;
      font-size: 0.9rem;
      color: #333;
    }

    .pie-legend-amount {
      font-weight: 600;
      color: #333;
      margin-right: 16px;
      font-size: 0.9rem;
    }

    .pie-legend-percent {
      font-weight: 700;
      color: #667eea;
      font-size: 0.95rem;
    }

    .chart-container {
      height: 280px;
      display: flex;
      align-items: flex-end;
      padding: 16px 0;
      border-top: 1px solid #eee;
      border-bottom: 1px solid #eee;
    }

    .chart-bars {
      display: flex;
      justify-content: space-around;
      align-items: flex-end;
      width: 100%;
      height: 100%;
      gap: 8px;
    }

    .chart-bar-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      flex: 1;
      height: 100%;
      justify-content: flex-end;
    }

    .chart-bar {
      width: 100%;
      max-width: 40px;
      background: linear-gradient(to top, #667eea, #764ba2);
      border-radius: 8px 8px 0 0;
      position: relative;
      cursor: pointer;
      min-height: 10px;
      transition: transform 0.2s ease;
    }

    .chart-bar:hover {
      transform: scale(1.05);
    }

    .bar-tooltip {
      display: none;
      position: absolute;
      bottom: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.85);
      color: white;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      white-space: nowrap;
      z-index: 10;
    }

    .chart-bar:hover .bar-tooltip {
      display: block;
    }

    .bar-tooltip::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(0,0,0,0.85);
    }

    .tooltip-value {
      font-weight: 600;
      margin-bottom: 4px;
    }

    .tooltip-amount,
    .tooltip-growth {
      opacity: 0.9;
      font-size: 0.8rem;
    }

    .chart-label {
      font-size: 0.75rem;
      color: #999;
      margin-top: 8px;
      text-align: center;
    }

    .chart-legend {
      display: flex;
      justify-content: center;
      gap: 24px;
      margin-top: 16px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .legend-color {
      width: 16px;
      height: 16px;
      border-radius: 4px;
    }

    .legend-text {
      font-size: 0.85rem;
      color: #666;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .modal-overlay.active {
      display: flex;
    }

    .modal {
      background: white;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 400px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    }

    .modal-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin-bottom: 20px;
      color: #333;
    }

    .form-group {
      margin-bottom: 16px;
    }

    .form-label {
      display: block;
      margin-bottom: 8px;
      font-weight: 600;
      color: #333;
    }

    .form-select,
    .form-input {
      width: 100%;
      padding: 12px;
      border: 2px solid #e2e8f0;
      border-radius: 8px;
      font-size: 1rem;
      transition: border-color 0.2s ease;
    }

    .form-select:focus,
    .form-input:focus {
      outline: none;
      border-color: #667eea;
    }

    .form-actions {
      display: flex;
      gap: 10px;
      margin-top: 24px;
    }

    .btn-cancel {
      flex: 1;
      padding: 12px;
      background: #e2e8f0;
      color: #64748b;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .btn-submit {
      flex: 2;
      padding: 12px;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
    }

    .empty-state {
      text-align: center;
      padding: 40px;
      color: #999;
    }

    .empty-state svg {
      width: 64px;
      height: 64px;
      margin-bottom: 16px;
      color: #cbd5e1;
    }

    .deposit-section {
      margin-bottom: 24px;
    }

    .deposit-list {
      display: grid;
      gap: 12px;
    }

    .deposit-item {
      background: white;
      border-radius: 12px;
      padding: 16px;
      display: flex;
      align-items: center;
      gap: 16px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .deposit-info {
      flex: 1;
    }

    .deposit-name {
      font-weight: 600;
      color: #333;
      font-size: 1rem;
    }

    .deposit-type {
      font-size: 0.85rem;
      color: #666;
      margin-top: 4px;
    }

    .deposit-repayment {
      font-size: 0.9rem;
      color: #22c55e;
      min-width: 100px;
      text-align: center;
    }

    .deposit-actions {
      display: flex;
      gap: 8px;
    }

    .deposit-actions button {
      padding: 8px 12px;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
      font-weight: 500;
    }

    .deposit-actions button:first-child {
      background: #f1f5f9;
      color: #64748b;
    }

    .deposit-actions button:last-child {
      background: #fee2e2;
      color: #dc2626;
    }

    .category-section {
      background: white;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.15);
      margin-top: 20px;
    }

    .category-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 16px;
    }

    .category-item {
      background: #f8fafc;
      border-radius: 12px;
      padding: 16px;
      text-align: center;
    }

    .category-name {
      font-size: 0.9rem;
      color: #666;
      margin-bottom: 8px;
    }

    .category-amount {
      font-size: 1.3rem;
      font-weight: 700;
    }

    .category-percentage {
      font-size: 0.8rem;
      color: #999;
      margin-top: 4px;
    }

    .fire-section {
      background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%);
      color: white;
    }

    .fire-section .card-title {
      color: rgba(255,255,255,0.8);
    }

    .fire-section .card-value {
      color: white;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }

    .fire-target {
      margin-top: 16px;
      padding-top: 16px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    .fire-target label {
      font-size: 0.9rem;
      opacity: 0.9;
    }

    .fire-target input {
      width: 100%;
      padding: 8px 12px;
      border: none;
      border-radius: 8px;
      margin-top: 8px;
      font-size: 1rem;
    }

    .fire-target button {
      width: 100%;
      margin-top: 12px;
      padding: 10px;
      background: rgba(255,255,255,0.2);
      color: white;
      border: 1px solid rgba(255,255,255,0.3);
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s ease;
    }

    .fire-target button:hover {
      background: rgba(255,255,255,0.3);
    }

    .progress-bar {
      width: 100%;
      height: 8px;
      background: rgba(255,255,255,0.3);
      border-radius: 4px;
      overflow: hidden;
      margin: 12px 0;
    }

    .progress-fill {
      height: 100%;
      background: white;
      border-radius: 4px;
      transition: width 0.5s ease;
    }

    .progress-text {
      font-size: 0.9rem;
      opacity: 0.9;
      text-align: right;
    }

    .remaining-amount {
      font-size: 1.1rem;
      font-weight: 600;
      margin-top: 8px;
      padding: 12px;
      background: rgba(255,255,255,0.15);
      border-radius: 8px;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>💰 钱多多 - 家庭理财 Agent</h1>
      <div class="toolbar">
        <button class="btn-settings" onclick="openUserInfoModal()" title="个人信息设置">👤</button>
        <button class="btn-settings" onclick="openDepositListModal()" title="资金存放池管理">💰</button>
      </div>
    </div>
    
    <div class="dashboard">
      <div class="card">
        <div class="card-title">资金总余额</div>
        <div class="card-value" id="capital-balance" style="color: #3b82f6;">¥ 0.00</div>
      </div>
      
      <div class="card">
        <div class="card-title">年度理财总收益</div>
        <div class="card-value" id="annual-investment" style="color: #10b981;">¥ 0.00</div>
      </div>
      
      <div class="card">
        <div class="card-title">月度结余</div>
        <div class="card-value" id="monthly-balance" style="color: #667eea;">N/A</div>
      </div>
      
      <div class="card">
        <div class="card-title">年度结余</div>
        <div class="card-value" id="annual-balance" style="color: #667eea;">N/A</div>
      </div>
      
      <div class="card health-section">
        <div class="card-title">储蓄健康状态</div>
        <div class="health-light" id="health-light"></div>
        <div class="health-status" id="health-status">加载中...</div>
        <div class="health-message" id="health-message"></div>
        <div class="savings-rate-display">
          储蓄率: <span id="health-savings-rate">N/A</span>
        </div>
      </div>
      
      <div class="card health-section">
        <div class="card-title">理财健康状态</div>
        <div class="health-light" id="investment-health-light"></div>
        <div class="health-status" id="investment-health-status">加载中...</div>
        <div class="health-message" id="investment-health-message"></div>
        <div class="savings-rate-display">
          年化利率: <span id="investment-annual-rate">N/A</span>
        </div>
      </div>
      
      <div class="card fire-section">
        <div class="card-title">🔥 FIRE 目标</div>
        <div class="card-value" id="fire-target">¥ 0.00</div>
        <div class="progress-bar">
          <div class="progress-fill" id="fire-progress" style="width: 0%"></div>
        </div>
        <div class="progress-text">已完成 <span id="fire-percentage">0%</span></div>
        <div class="remaining-amount" id="fire-remaining">距离 FIRE 还需: ¥ 0.00</div>
        <div class="remaining-amount" style="background: rgba(255,255,255,0.2);" id="fire-years">还需 <span style="font-size: 1.4rem;">0</span> 年实现 FIRE</div>
      </div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="all">全部收入</button>
      <button class="tab" data-tab="distribution">资金分布</button>
      <button class="tab" data-tab="capital">资金余额</button>
      <button class="tab" data-tab="investment">理财收益</button>
    </div>

    <div class="transaction-section">
      <div class="section-header">
        <h2 class="section-title" id="transaction-title">收入记录</h2>
        <button class="btn-add" onclick="openAddModal()">+ 添加记录</button>
      </div>
      
      <div class="transaction-list" id="transaction-list">
        <div class="empty-state">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="10"></circle>
            <polyline points="12 6 12 12 16 14"></polyline>
          </svg>
          <p>暂无交易记录</p>
          <p style="font-size: 0.85rem;">点击上方按钮添加第一条记录</p>
        </div>
      </div>
    </div>

  </div>

  <div class="modal-overlay" id="welcome-modal" style="display: flex;">
    <div class="modal" style="max-width: 450px;">
      <h3 class="modal-title">👋 欢迎使用钱多多</h3>
      <p style="color: #666; margin-bottom: 20px;">为了更好地为您计算FIRE目标，请提供以下信息：</p>
      
      <div class="form-group">
        <label class="form-label">目前家庭年支出（万元） <span style="color: #ef4444;">*</span></label>
        <input type="number" step="0.1" class="form-input" id="welcome-annual-expense" value="5" min="0">
      </div>

      <div class="form-group">
        <label class="form-label">您的家庭理财情况 <span style="color: #ef4444;">*</span></label>
        <select class="form-input" id="welcome-risk-profile">
          <option value="">请选择</option>
          <option value="conservative">保守 - 2.5%（适合债券为主、低波动组合）</option>
          <option value="moderate">中性 - 3.5%（股债平衡、低费率全球指数基金）</option>
          <option value="aggressive">积极 - 4.5%（偏股型组合，愿意承担较大波动）</option>
        </select>
      </div>

      <div class="form-actions">
        <button class="btn-cancel" onclick="skipWelcome()">跳过</button>
        <button class="btn-submit" onclick="saveUserInfo()" style="flex: 1;">确认</button>
      </div>
    </div>
  </div>

  <div class="modal-overlay" id="user-info-modal">
    <div class="modal" style="max-width: 450px;">
      <h3 class="modal-title">👤 个人信息设置</h3>
      
      <div class="form-group">
        <label class="form-label">目前家庭年收入（万元） <span style="color: #ef4444;">*</span></label>
        <input type="number" step="0.1" class="form-input" id="edit-annual-income" min="0">
      </div>

      <div class="form-group">
        <label class="form-label">目前家庭年支出（万元） <span style="color: #ef4444;">*</span></label>

  <script>
    window.submitTransaction = async function() {
      const depositAccountId = parseInt(document.getElementById('deposit-account-select').value);
      const capitalBalanceInput = document.getElementById('capital-balance-input').value;
      const investmentBalanceInput = document.getElementById('investment-balance-input').value;
      
      const capitalBalance = capitalBalanceInput ? parseFloat(capitalBalanceInput) : 0;
      const investmentBalance = investmentBalanceInput ? parseFloat(investmentBalanceInput) : 0;
      const description = document.getElementById('description-input').value;
      const date = document.getElementById('date-input').value;

      if (!depositAccountId) {
        alert('请选择资金存放地');
        return;
      }

      if (!capitalBalance && capitalBalance !== 0 || capitalBalance < 0) {
        alert('请输入有效的资金余额（必须大于等于0）');
        return;
      }

      const depositAccounts = await window.fetchData('/deposit-accounts');
      const selectedAccount = depositAccounts.find(a => a.id === depositAccountId);
      
      if (selectedAccount.type === 'bank' && !selectedAccount.repaymentDay) {
        const today = new Date();
        const day = today.getDate();
        if (day <= 15) {
          alert('⚠️ 您尚未设置该银行的还款日，还款所导致的减少金额可能会显示在下个月总金额中');
        }
      }

      try {
        const data = { 
          type: 'income', 
          category: 'income',
          amount: capitalBalance,
          capitalBalance,
          investmentBalance,
          description, 
          date, 
          depositAccountId 
        };
        console.log('========== submitTransaction 开始 ==========');
        console.log('提交数据:', data);
        console.log('window.editingTransactionId 值:', window.editingTransactionId);
        console.log('window.editingTransactionId 类型:', typeof window.editingTransactionId);
        console.log('window.editingTransactionId 是否为 truthy:', !!window.editingTransactionId);
        console.log('window.editingTransactionId !== null:', window.editingTransactionId !== null);
        
        let response;
        if (window.editingTransactionId) {
          console.log('发送 PUT 请求到:', `/api/transactions/${window.editingTransactionId}`);
          response = await fetch(`/api/transactions/${window.editingTransactionId}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        } else {
          response = await fetch('/api/transactions', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(data)
          });
        }

        if (response.ok) {
          window.closeModal();
          await window.refreshData();
          window.editingTransactionId = null;
        } else {
          const errorData = await response.json();
          const actionText = window.editingTransactionId ? '修改' : '添加';
          alert(actionText + '失败: ' + (errorData.error || '未知错误'));
        }
      } catch (error) {
        alert('网络错误，请重试: ' + error.message);
      }
    };
    
    window.openEditModal = async function(transactionId) {
      console.log('========== openEditModal 开始 ==========');
      console.log('transactionId 参数:', transactionId);
      console.log('transactionId 类型:', typeof transactionId);
      window.editingTransactionId = transactionId;
      console.log('window.editingTransactionId 已设置为:', window.editingTransactionId);
      console.log('window.editingTransactionId 类型:', typeof window.editingTransactionId);
      
      await window.refreshDepositAccounts();
      const transaction = await window.fetchData(`/transactions/${transactionId}`);
      
      if (!transaction) {
        alert('无法获取交易记录，请刷新页面重试');
        return;
      }
      
      document.getElementById('deposit-account-select').value = transaction.depositAccountId || '';
      document.getElementById('capital-balance-input').value = transaction.capitalBalance || '';
      document.getElementById('investment-balance-input').value = transaction.investmentBalance || '';
      document.getElementById('description-input').value = transaction.description || '';
      document.getElementById('date-input').value = transaction.date || '';
      
      const modalTitle = document.querySelector('#modal-overlay .modal-title');
      if (modalTitle) {
        modalTitle.textContent = '修改收入记录';
      }
      
      const submitBtn = document.querySelector('#modal-overlay .btn-submit');
      if (submitBtn) {
        submitBtn.textContent = '确认修改';
      }
      
      document.getElementById('modal-overlay').classList.add('active');
    };
    
    window.closeModal = function() {
      document.getElementById('modal-overlay').classList.remove('active');
      window.editingTransactionId = null;
    };
    
    window.editingTransactionId = null;
    
    const INCOME_CATEGORIES = ['工资', '奖金', '投资收益', '兼职', '其他收入'];
    const EXPENSE_CATEGORIES = ['餐饮', '交通', '购物', '娱乐', '医疗', '教育', '房租', '水电', '其他支出'];
    
    const DEPOSIT_ACCOUNT_OPTIONS = [
      { name: '招商银行', type: 'bank' },
      { name: '中国农业银行', type: 'bank' },
      { name: '江苏银行', type: 'bank' },
      { name: '盛京银行', type: 'bank' },
      { name: '支付宝', type: 'alipay' },
      { name: '京东金融', type: 'jd' },
      { name: '微信余额', type: 'wechat' },
      { name: '广发证券', type: 'securities' },
    ];
    
    let userAge = 30;
    let userGender = 'male';
    let userAnnualIncome = 0;
    let userAnnualExpense = 50000;
    let userRiskProfile = '';

    function getUserInfo() {
      const saved = localStorage.getItem('userInfo');
      if (saved) {
        const info = JSON.parse(saved);
        userAge = info.age;
        userGender = info.gender;
        userAnnualIncome = info.annualIncome || 0;
        userAnnualExpense = info.annualExpense || 50000;
        userRiskProfile = info.riskProfile || '';
        return true;
      }
      return false;
    }

    function saveUserInfo() {
      const annualIncome = parseFloat(document.getElementById('welcome-annual-income').value);
      if (!annualIncome || annualIncome <= 0) {
        alert('请输入有效的家庭年收入（大于0）');
        return;
      }
      
      const annualExpense = parseFloat(document.getElementById('welcome-annual-expense').value);
      if (!annualExpense || annualExpense < 0) {
        alert('请输入有效的家庭年支出（大于等于0）');
        return;
      }
      
      const riskProfile = document.getElementById('welcome-risk-profile').value;
      if (!riskProfile) {
        alert('请选择您的家庭理财情况');
        return;
      }
      
      userAnnualIncome = annualIncome * 10000;
      userAnnualExpense = annualExpense * 10000;
      userRiskProfile = riskProfile;
      
      const userInfo = { 
        gender: userGender,
        annualIncome: userAnnualIncome,
        annualExpense: userAnnualExpense,
        riskProfile: userRiskProfile
      };

      document.getElementById('welcome-modal').style.display = 'none';

    }

    function skipWelcome() {
      localStorage.setItem('userInfo', JSON.stringify({ 
        gender: 'male',
        annualIncome: 100000,
        annualExpense: 50000,
        riskProfile: 'moderate'
      }));
      document.getElementById('welcome-modal').style.display = 'none';
      refreshData();
    }

    async function fetchData(url) {
      const response = await fetch(`/api${url}`);
      return response.json();
    }
    window.fetchData = fetchData;

    async function refreshData() {
      await refreshSummary();
      await refreshTransactions('all');
      await refreshFireInfo();
      await refreshDepositAccounts();
    }

    async function refreshSummary() {
      const transactions = await fetchData('/transactions');
      const incomeTransactions = transactions.filter(t => t.type === 'income');

      const monthlyData = {};
      incomeTransactions.forEach(t => {
        const date = new Date(t.date);
        const monthKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
        const year = date.getFullYear();
        const capitalBalance = t.capitalBalance || t.amount || 0;
        const investmentBalance = t.investmentBalance || 0;
        
        if (!monthlyData[monthKey]) {
          monthlyData[monthKey] = { year, totalCapital: 0, totalInvestment: 0 };
        }
        monthlyData[monthKey].totalCapital += capitalBalance;
        monthlyData[monthKey].totalInvestment += investmentBalance;
      });

      const sortedMonths = Object.keys(monthlyData).sort((a, b) => b.localeCompare(a));
      const currentMonthKey = sortedMonths[0] || null;
      const currentYear = new Date().getFullYear();
      
      const currentMonthCapital = currentMonthKey ? monthlyData[currentMonthKey].totalCapital : 0;
      document.getElementById('capital-balance').textContent = formatMoney(currentMonthCapital);
      
      let annualBalance = 'N/A';
      const currentYearMonths = Object.keys(monthlyData).filter(k => monthlyData[k].year === currentYear);
      const lastYearMonths = Object.keys(monthlyData).filter(k => monthlyData[k].year === currentYear - 1);
      
      if (currentYearMonths.length > 0) {
        const currentYearTotal = currentYearMonths.reduce((sum, k) => sum + monthlyData[k].totalCapital, 0);
        if (lastYearMonths.length > 0) {
          const lastYearTotal = lastYearMonths.reduce((sum, k) => sum + monthlyData[k].totalCapital, 0);
          const balance = currentYearTotal - lastYearTotal;
          const sign = balance >= 0 ? '+' : '';
          annualBalance = sign + formatMoney(balance);
          document.getElementById('annual-balance').style.color = balance >= 0 ? '#10b981' : '#ef4444';
        } else {
          annualBalance = 'N/A';
          document.getElementById('annual-balance').style.color = '#667eea';
        }
      }
      document.getElementById('annual-balance').textContent = annualBalance;
      
      let monthlyBalance = 'N/A';
      const monthsAsc = Object.keys(monthlyData).sort((a, b) => a.localeCompare(b));
      if (monthsAsc.length >= 2) {
        const currentMonth = monthsAsc[monthsAsc.length - 1];
        const prevMonth = monthsAsc[monthsAsc.length - 2];
        const balance = monthlyData[currentMonth].totalCapital - monthlyData[prevMonth].totalCapital;
        const sign = balance >= 0 ? '+' : '';
        monthlyBalance = sign + formatMoney(balance);
        document.getElementById('monthly-balance').style.color = balance >= 0 ? '#10b981' : '#ef4444';
      } else {
        document.getElementById('monthly-balance').style.color = '#667eea';
      }
      document.getElementById('monthly-balance').textContent = monthlyBalance;
      
      let annualInvestment = 0;
      if (currentYearMonths.length > 0) {
        annualInvestment = currentYearMonths.reduce((sum, k) => sum + monthlyData[k].totalInvestment, 0);
      }
      document.getElementById('annual-investment').textContent = formatMoney(annualInvestment);
      document.getElementById('annual-investment').style.color = annualInvestment >= 0 ? '#10b981' : '#ef4444';
      
      let savingsRate = 'N/A';
       if (monthsAsc.length >= 2) {
         let totalMonthlySavings = 0;
         let monthCount = 0;
         
         for (let i = 1; i < monthsAsc.length; i++) {
           const currentMonth = monthsAsc[i];
           const prevMonth = monthsAsc[i - 1];
           const capitalChange = monthlyData[currentMonth].totalCapital - monthlyData[prevMonth].totalCapital;
           const investmentIncome = monthlyData[currentMonth].totalInvestment;
           const monthlySavings = capitalChange - investmentIncome;
           totalMonthlySavings += monthlySavings;
           monthCount++;
         }
         
         let annualSavings;
         if (monthCount >= 12) {
           const recent12MonthsAsc = monthsAsc.slice(-12);
           annualSavings = 0;
           for (let i = 1; i < recent12MonthsAsc.length; i++) {
             const currentMonth = recent12MonthsAsc[i];
             const prevMonth = recent12MonthsAsc[i - 1];
             const capitalChange = monthlyData[currentMonth].totalCapital - monthlyData[prevMonth].totalCapital;
             const investmentIncome = monthlyData[currentMonth].totalInvestment;
             annualSavings += capitalChange - investmentIncome;
           }
         } else {
           annualSavings = (totalMonthlySavings / monthCount) * 12;
         }
         
         const annualExpense = userAnnualExpense || 0;
         const annualIncome = annualSavings + annualExpense;
         
         if (annualIncome > 0) {
           const rate = (annualSavings / annualIncome * 100).toFixed(1);
           savingsRate = rate + '%';
         }
       }
      
      const healthLight = document.getElementById('health-light');
      const healthStatusEl = document.getElementById('health-status');
      const healthMessageEl = document.getElementById('health-message');
      const healthSavingsRateEl = document.getElementById('health-savings-rate');
      
      healthSavingsRateEl.textContent = savingsRate;
      
      let status = 'danger';
      let statusText = '❌ 未知';
      let message = '请输入足够的数据以计算储蓄率';
      
      if (savingsRate !== 'N/A') {
        const rate = parseFloat(savingsRate.replace('%', ''));
        if (!isNaN(rate)) {
          if (rate >= 50) {
            status = 'healthy';
            statusText = '✅ 优秀';
            message = '储蓄率非常健康！继续保持';
          } else if (rate > 0 && rate < 50) {
            status = 'warning';
            statusText = '⚠️ 注意';
            message = '财务状况有待提高！储蓄率较低';
          } else {
            status = 'danger';
            statusText = '❌ 危险';
            message = '储蓄率为负或零，需要调整支出习惯';
          }
        }
      }
      
      healthLight.className = `health-light ${status}`;
      healthStatusEl.textContent = statusText;
      healthMessageEl.textContent = message;
      
      const investmentHealthLight = document.getElementById('investment-health-light');
      const investmentHealthStatusEl = document.getElementById('investment-health-status');
      const investmentHealthMessageEl = document.getElementById('investment-health-message');
      const investmentAnnualRateEl = document.getElementById('investment-annual-rate');
      
      let investmentRate = 'N/A';
      let investmentStatus = 'danger';
      let investmentStatusText = '❌ 未知';
      let investmentMessage = '请输入足够的数据以计算年化利率';
      
      const n = monthsAsc.length;
      
      if (n <= 1) {
        investmentRate = 'N/A';
        investmentStatus = 'danger';
        investmentStatusText = '❌ 未知';
        investmentMessage = '数据不足，无法计算年化利率';
      } else if (n >= 2 && n <= 11) {
        let product = 1;
        for (let i = 1; i < monthsAsc.length; i++) {
          const currentMonth = monthsAsc[i];
          const prevMonth = monthsAsc[i - 1];
          if (monthlyData[prevMonth].totalCapital > 0) {
            const rate = monthlyData[currentMonth].totalInvestment / monthlyData[prevMonth].totalCapital;
            product *= (1 + rate);
          }
        }
        const annualRate = Math.pow(product, 12 / (n - 1)) - 1;
        investmentRate = (annualRate * 100).toFixed(2) + '%';
        
        const rateValue = annualRate * 100;
        if (rateValue >= 3.5) {
          investmentStatus = 'healthy';
          investmentStatusText = '✅ 优秀';
          investmentMessage = '理财收益表现优秀！继续保持';
        } else if (rateValue > 0 && rateValue < 3.5) {
          investmentStatus = 'warning';
          investmentStatusText = '⚠️ 注意';
          investmentMessage = '理财收益有待提高！可以考虑优化配置';
        } else {
          investmentStatus = 'danger';
          investmentStatusText = '❌ 危险';
          investmentMessage = '理财收益为负或零，需要调整投资策略';
        }
      } else if (n >= 12) {
        const recent12MonthsAsc = monthsAsc.slice(-12);
        let product = 1;
        for (let i = 1; i < recent12MonthsAsc.length; i++) {
          const currentMonth = recent12MonthsAsc[i];
          const prevMonth = recent12MonthsAsc[i - 1];
          if (monthlyData[prevMonth].totalCapital > 0) {
            const rate = monthlyData[currentMonth].totalInvestment / monthlyData[prevMonth].totalCapital;
            product *= (1 + rate);
          }
        }
        const annualRate = product - 1;
        investmentRate = (annualRate * 100).toFixed(2) + '%';
        
        const rateValue = annualRate * 100;
        if (rateValue >= 3.5) {
          investmentStatus = 'healthy';
          investmentStatusText = '✅ 优秀';
          investmentMessage = '理财收益表现优秀！继续保持';
        } else if (rateValue > 0 && rateValue < 3.5) {
          investmentStatus = 'warning';
          investmentStatusText = '⚠️ 注意';
          investmentMessage = '理财收益有待提高！可以考虑优化配置';
        } else {
          investmentStatus = 'danger';
          investmentStatusText = '❌ 危险';
          investmentMessage = '理财收益为负或零，需要调整投资策略';
        }
      }
      
      investmentAnnualRateEl.textContent = investmentRate;
      investmentHealthLight.className = `health-light ${investmentStatus}`;
      investmentHealthStatusEl.textContent = investmentStatusText;
      investmentHealthMessageEl.textContent = investmentMessage;
    }

    function getStatusText(status) {
      const texts = {
        healthy: '✅ 健康',
        warning: '⚠️ 注意',
        danger: '❌ 危险'
      };
      return texts[status] || status;
    }

    function formatMoney(amount) {
      return '¥ ' + amount.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    }

    async function refreshTransactions(filter) {
      const transactions = await fetchData('/transactions');
      const depositAccounts = await fetchData('/deposit-accounts');
      const incomeTransactions = transactions.filter(t => t.type === 'income');
      
      // 将交易记录与资金存放地关联
      const transactionsWithAccount = incomeTransactions.map(t => {
        const account = depositAccounts.find(a => a.id === t.depositAccountId);
        return {
          ...t,
          accountName: account ? account.name : '未知账户'
        };
      });
      
      // 控制标题显示
      const titleElement = document.getElementById('transaction-title');
      if (filter === 'capital' || filter === 'investment' || filter === 'distribution') {
        titleElement.style.display = 'none';
      } else {
        titleElement.style.display = 'block';
      }
      
      let filtered;
      if (filter === 'all') {
        filtered = transactionsWithAccount;
      } else if (filter === 'capital') {
        filtered = transactionsWithAccount;
      } else if (filter === 'investment') {
        filtered = transactionsWithAccount;
      } else {
        filtered = transactionsWithAccount;
      }
      
      displayTransactions(filtered, filter);
    }

    function displayTransactions(transactions, filter) {
      const container = document.getElementById('transaction-list');
      
      if (transactions.length === 0) {
        container.innerHTML = `
          <div class="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <p>暂无收入记录</p>
          </div>
        `;
        return;
      }

      if (filter === 'distribution') {
        const accountData = {};
        let totalCapital = 0;
        
        const now = new Date();
        const currentMonth = now.getFullYear() + '-' + String(now.getMonth() + 1).padStart(2, '0');
        
        const currentMonthTransactions = transactions.filter(t => {
          const transactionDate = new Date(t.date);
          const transactionMonth = transactionDate.getFullYear() + '-' + String(transactionDate.getMonth() + 1).padStart(2, '0');
          return transactionMonth === currentMonth;
        });
        
        currentMonthTransactions.forEach(t => {
          const accountName = t.accountName || '未分类';
          const capitalBalance = t.capitalBalance || t.amount;
          
          if (!accountData[accountName]) {
            accountData[accountName] = { amount: 0 };
          }
          accountData[accountName].amount += capitalBalance;
          totalCapital += capitalBalance;
        });
        
        const colors = [
          '#667eea', '#764ba2', '#f093fb', '#f5576c', 
          '#4facfe', '#00f2fe', '#43e97b', '#38f9d7',
          '#fa709a', '#fee140', '#fdb99b', '#e0c3fc'
        ];
        
        const chartSize = 380;
        const centerX = chartSize / 2;
        const centerY = chartSize / 2;
        const radius = 120;
        const labelRadius = 165;
        const padding = 55;
        
        let html = `<div class="chart-section" style="text-align: center; padding: 20px;">`;
        html += `<h3 style="margin-bottom: 20px; font-size: 1.25rem; color: #333;">资金余额分布</h3>`;
        
        html += `<div class="pie-chart-container" style="display: inline-block;"><svg viewBox="0 0 ${chartSize} ${chartSize}" class="pie-chart" style="width: ${chartSize}px; height: ${chartSize}px;">`;
        
        const accountList = Object.keys(accountData).map(accountName => ({
          name: accountName,
          amount: accountData[accountName].amount,
          percentage: totalCapital > 0 ? (accountData[accountName].amount / totalCapital * 100) : 0
        })).sort((a, b) => b.amount - a.amount);
        
        let currentAngle = 0;
        let colorIndex = 0;
        const usedLabelPositions = [];
        
        accountList.forEach(item => {
          const accountName = item.name;
          const amount = item.amount;
          const percentage = totalCapital > 0 ? (amount / totalCapital * 100).toFixed(1) : '0';
          const angle = (amount / totalCapital) * 360;
          
          const startAngle = currentAngle;
          const endAngle = currentAngle + angle;
          
          const startRad = (startAngle - 90) * (Math.PI / 180);
          const endRad = (endAngle - 90) * (Math.PI / 180);
          
          const x1 = centerX + radius * Math.cos(startRad);
          const y1 = centerY + radius * Math.sin(startRad);
          const x2 = centerX + radius * Math.cos(endRad);
          const y2 = centerY + radius * Math.sin(endRad);
          
          const largeArcFlag = angle > 180 ? 1 : 0;
          
          const pathD = `M ${centerX} ${centerY} L ${x1} ${y1} A ${radius} ${radius} 0 ${largeArcFlag} 1 ${x2} ${y2} Z`;
          const color = colors[colorIndex % colors.length];
          
          html += `<path d="${pathD}" fill="${color}" stroke="#fff" stroke-width="2" class="pie-slice" />`;
          
          const midAngle = (startAngle + endAngle) / 2;
          const midRad = (midAngle - 90) * (Math.PI / 180);
          
          const lineEndX = centerX + (radius + 12) * Math.cos(midRad);
          const lineEndY = centerY + (radius + 12) * Math.sin(midRad);
          
          let labelX = centerX + labelRadius * Math.cos(midRad);
          let labelY = centerY + labelRadius * Math.sin(midRad);
          
          labelX = Math.max(padding, Math.min(chartSize - padding, labelX));
          labelY = Math.max(padding, Math.min(chartSize - padding, labelY));
          
          let offsetY = 0;
          const minDistance = 35;
          for (const pos of usedLabelPositions) {
            const dist = Math.sqrt(Math.pow(labelX - pos.x, 2) + Math.pow(labelY + offsetY - pos.y, 2));
            if (dist < minDistance) {
              offsetY += 18;
            }
          }
          const finalLabelY = labelY + offsetY;
          usedLabelPositions.push({ x: labelX, y: finalLabelY });
          
          const isLeft = midRad > Math.PI/2 || midRad < -Math.PI/2;
          const textAnchor = isLeft ? 'end' : 'start';
          
          html += `<line x1="${(x1 + x2) / 2}" y1="${(y1 + y2) / 2}" x2="${lineEndX}" y2="${lineEndY}" stroke="#999" stroke-width="1" stroke-dasharray="3,2" />`;
          html += `<line x1="${lineEndX}" y1="${lineEndY}" x2="${labelX}" y2="${finalLabelY}" stroke="#999" stroke-width="1" stroke-dasharray="3,2" />`;
          
          html += `<text x="${labelX}" y="${finalLabelY}" text-anchor="${textAnchor}" font-size="12" font-weight="600" fill="#333">${percentage}%</text>`;
          
          currentAngle = endAngle;
          colorIndex++;
        });
        
        html += `</svg></div>`;
        
        html += `<div style="margin-top: 20px; text-align: left; max-width: 300px; margin-left: auto; margin-right: auto;">`;
        html += `<div style="font-size: 14px; font-weight: 600; color: #333; margin-bottom: 12px; border-bottom: 1px solid #eee; padding-bottom: 8px;">资金明细</div>`;
        
        colorIndex = 0;
        accountList.forEach(item => {
          const accountName = item.name;
          const amount = item.amount;
          const percentage = totalCapital > 0 ? (item.amount / totalCapital * 100).toFixed(1) : '0';
          const color = colors[colorIndex % colors.length];
          
          html += `<div style="display: flex; align-items: center; padding: 8px 0; border-bottom: 1px solid #f5f5f5;" data-account="${accountName}">`;
          html += `<div style="width: 16px; height: 16px; border-radius: 3px; background-color: ${color}; margin-right: 12px; flex-shrink: 0;"></div>`;
          html += `<div style="flex: 1; min-width: 0;">`;
          html += `<div style="font-size: 14px; font-weight: 500; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">${accountName}</div>`;
          html += `<div style="font-size: 12px; color: #999;">占比 ${percentage}%</div>`;
          html += `</div>`;
          html += `<div style="font-size: 14px; font-weight: 600; color: #667eea; margin-left: 12px;">${formatMoney(amount)}</div>`;
          html += `</div>`;
          
          colorIndex++;
        });
        
        html += `<div style="margin-top: 12px; padding-top: 12px; border-top: 2px solid #eee;">`;
        html += `<div style="display: flex; justify-content: space-between; align-items: center;">`;
        html += `<span style="font-size: 14px; font-weight: 600; color: #333;">资金总余额</span>`;
        html += `<span style="font-size: 16px; font-weight: 700; color: #667eea;">${formatMoney(totalCapital)}</span>`;
        html += `</div>`;
        html += `</div>`;
        
        html += `</div></div>`;
        
        container.innerHTML = html;
      } else if (filter === 'investment') {
        const monthlyData = {};
        transactions.forEach(t => {
          const date = new Date(t.date);
          const monthKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          const monthLabel = (date.getMonth() + 1) + '月';
          const investmentBalance = t.investmentBalance || 0;
          const capitalBalance = t.capitalBalance || t.amount;
          
          if (!monthlyData[monthKey]) {
            monthlyData[monthKey] = { 
              label: monthLabel, 
              year: date.getFullYear(),
              totalInvestment: 0,
              totalCapital: 0
            };
          }
          monthlyData[monthKey].totalInvestment += investmentBalance;
          monthlyData[monthKey].totalCapital += capitalBalance;
        });

        const sortedMonths = Object.keys(monthlyData).sort((a, b) => a.localeCompare(b));
        
        sortedMonths.forEach((monthKey, index) => {
          const prevMonthKey = index > 0 ? sortedMonths[index - 1] : null;
          if (!prevMonthKey) {
            monthlyData[monthKey].rate = 'N/A';
          } else {
            const prevCapital = monthlyData[prevMonthKey].totalCapital;
            monthlyData[monthKey].rate = prevCapital > 0 ? (monthlyData[monthKey].totalInvestment / prevCapital * 100).toFixed(2) : '0.00';
          }
        });
        
        let estimatedAnnualRate = 'N/A';
        const n = sortedMonths.length;
        
        if (n <= 1) {
          estimatedAnnualRate = 'N/A';
        } else if (n >= 2 && n <= 11) {
          let product = 1;
          for (let i = 1; i < sortedMonths.length; i++) {
            const currentMonth = sortedMonths[i];
            const prevMonth = sortedMonths[i - 1];
            if (monthlyData[prevMonth].totalCapital > 0) {
              const rate = monthlyData[currentMonth].totalInvestment / monthlyData[prevMonth].totalCapital;
              product *= (1 + rate);
            }
          }
          const annualRate = Math.pow(product, 12 / (n - 1)) - 1;
          estimatedAnnualRate = (annualRate * 100).toFixed(2) + '%';
        } else if (n >= 12) {
          const recent12Months = sortedMonths.slice(-12);
          let product = 1;
          for (let i = 1; i < recent12Months.length; i++) {
            const currentMonth = recent12Months[i];
            const prevMonth = recent12Months[i - 1];
            if (monthlyData[prevMonth].totalCapital > 0) {
              const rate = monthlyData[currentMonth].totalInvestment / monthlyData[prevMonth].totalCapital;
              product *= (1 + rate);
            }
          }
          const annualRate = product - 1;
          estimatedAnnualRate = (annualRate * 100).toFixed(2) + '%';
        }

        const maxRate = Math.max(...Object.values(monthlyData).map(d => Math.abs(parseFloat(d.rate))), 1);
        
        let html = `<div class="chart-section"><div class="chart-header"><h3 style="display: flex; align-items: center; gap: 8px;">理财收益月度收益率 <span onclick="showInvestmentReturnFormulas()" style="cursor: pointer; width: 20px; height: 20px; border-radius: 50%; background: #f59e0b; color: white; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center;">!</span></h3><div class="growth-summary"><div class="growth-item"><span class="growth-label">本月收益率</span><span class="growth-value ${parseFloat(monthlyData[sortedMonths[sortedMonths.length - 1]].rate) >= 0 ? 'positive' : 'negative'}">${monthlyData[sortedMonths[sortedMonths.length - 1]].rate}%</span></div><div class="growth-item"><span class="growth-label">年化利率</span><span class="growth-value ${estimatedAnnualRate !== 'N/A' && parseFloat(estimatedAnnualRate) >= 0 ? 'positive' : 'negative'}">${estimatedAnnualRate}</span></div></div></div><div id="investment-return-formula" style="display: none; background: #fef3c7; border: 1px solid #fbbf24; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #92400e;"><strong>📐 计算公式：</strong><br>• <strong>月收益率</strong> = 本月理财总收益 / 上月资金总余额 × 100%<br>• <strong>年化利率</strong>：0-1个月数据为N/A；2-11个月数据使用复合增长率公式：(1+r₁)×(1+r₂)×...×(1+rₙ)^(12/(n-1)) - 1；12个月及以上数据使用真实年化：(1+r₁)×(1+r₂)×...×(1+r₁₂) - 1</div><div class="chart-container"><div class="chart-bars">`;
        
        sortedMonths.forEach(monthKey => {
          const data = monthlyData[monthKey];
          const heightPercent = (Math.abs(parseFloat(data.rate)) / maxRate) * 100;
          html += `<div class="chart-bar-wrapper"><div class="chart-bar investment" style="height: ${Math.max(heightPercent, 5)}%; background: ${parseFloat(data.rate) >= 0 ? 'linear-gradient(to top, #10b981, #34d399)' : 'linear-gradient(to top, #ef4444, #f87171)'}"><div class="bar-tooltip"><div class="tooltip-value">${data.year}年${data.label}</div><div class="tooltip-amount">收益率: ${data.rate}%</div><div class="tooltip-growth">总收益: ${data.totalInvestment >= 0 ? '+' : ''}${formatMoney(data.totalInvestment)}</div></div></div><div class="chart-label">${data.label}</div></div>`;
        });
        
        html += `</div></div><div class="chart-legend"><div class="legend-item"><span class="legend-color" style="background: linear-gradient(to top, #10b981, #34d399);"></span><span class="legend-text">正收益</span></div><div class="legend-item"><span class="legend-color" style="background: linear-gradient(to top, #ef4444, #f87171);"></span><span class="legend-text">负收益</span></div></div></div>`;
        
        container.innerHTML = html;
      } else if (filter === 'capital') {
        const monthlyData = {};
        transactions.forEach(t => {
          const date = new Date(t.date);
          const monthKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          const monthLabel = (date.getMonth() + 1) + '月';
          const capitalBalance = t.capitalBalance || t.amount;
          
          if (!monthlyData[monthKey]) {
            monthlyData[monthKey] = { 
              label: monthLabel, 
              year: date.getFullYear(),
              total: 0,
              count: 0 
            };
          }
          monthlyData[monthKey].total += capitalBalance;
          monthlyData[monthKey].count++;
        });

        const sortedMonths = Object.keys(monthlyData).sort((a, b) => a.localeCompare(b));
        
        const growthRates = {};
        for (let i = 1; i < sortedMonths.length; i++) {
          const current = sortedMonths[i];
          const previous = sortedMonths[i - 1];
          const growth = ((monthlyData[current].total - monthlyData[previous].total) / monthlyData[previous].total * 100).toFixed(2);
          growthRates[current] = parseFloat(growth);
        }
        
        let annualGrowth = 'N/A';
        if (sortedMonths.length >= 12) {
          const currentYearTotal = Object.keys(monthlyData)
            .filter(k => k.startsWith(String(new Date().getFullYear())))
            .reduce((sum, k) => sum + monthlyData[k].total, 0);
          const lastYearTotal = Object.keys(monthlyData)
            .filter(k => k.startsWith(String(new Date().getFullYear() - 1)))
            .reduce((sum, k) => sum + monthlyData[k].total, 0);
          if (lastYearTotal > 0) {
            annualGrowth = ((currentYearTotal - lastYearTotal) / lastYearTotal * 100).toFixed(2) + '%';
          }
        }

        const maxValue = Math.max(...Object.values(monthlyData).map(d => d.total));
        
        const latestMonth = sortedMonths[sortedMonths.length - 1];
        let html = `<div class="chart-section"><div class="chart-header"><h3 style="display: flex; align-items: center; gap: 8px;">资金余额月度增长趋势 <span onclick="showCapitalGrowthFormulas()" style="cursor: pointer; width: 20px; height: 20px; border-radius: 50%; background: #f59e0b; color: white; font-size: 12px; font-weight: bold; display: inline-flex; align-items: center; justify-content: center;">!</span></h3><div class="growth-summary"><div class="growth-item"><span class="growth-label">本月增长率</span><span class="growth-value ${growthRates[latestMonth] >= 0 ? 'positive' : 'negative'}">${growthRates[latestMonth] !== undefined ? (growthRates[latestMonth] >= 0 ? '+' : '') + growthRates[latestMonth] + '%' : 'N/A'}</span></div><div class="growth-item"><span class="growth-label">年度增长率</span><span class="growth-value ${annualGrowth !== 'N/A' && parseFloat(annualGrowth) >= 0 ? 'positive' : 'negative'}">${annualGrowth}</span></div></div></div><div id="capital-growth-formula" style="display: none; background: #fef3c7; border: 1px solid #fbbf24; border-radius: 8px; padding: 12px; margin-bottom: 16px; font-size: 13px; color: #92400e;"><strong>📐 计算公式：</strong><br>• <strong>月度增长率</strong> = (本月资金总余额 - 上月资金总余额) / 上月资金总余额 × 100%<br>• <strong>年度增长率</strong> = (本年资金总余额 -去年资金总余额) / 去年资金总余额 × 100%</div><div class="chart-container"><div class="chart-bars">`;
        
        sortedMonths.forEach(monthKey => {
          const data = monthlyData[monthKey];
          const heightPercent = (data.total / maxValue) * 100;
          const growthRate = growthRates[monthKey];
          html += `<div class="chart-bar-wrapper"><div class="chart-bar" style="height: ${Math.max(heightPercent, 5)}%"><div class="bar-tooltip"><div class="tooltip-value">${data.year}年${data.label}</div><div class="tooltip-amount">总余额: ${formatMoney(data.total)}</div><div class="tooltip-growth">增长率: ${growthRate !== undefined ? (growthRate >= 0 ? '+' : '') + growthRate + '%' : 'N/A'}</div></div></div><div class="chart-label">${data.label}</div></div>`;
        });
        
        html += `</div></div><div class="chart-legend"><div class="legend-item"><span class="legend-color" style="background: linear-gradient(to top, #667eea, #764ba2);"></span><span class="legend-text">资金余额</span></div></div></div>`;
        
        container.innerHTML = html;
      } else {
        const groupedByMonth = {};
        transactions.forEach(t => {
          const date = new Date(t.date);
          const monthKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          const monthLabel = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          if (!groupedByMonth[monthKey]) {
            groupedByMonth[monthKey] = { label: monthLabel, transactions: [], totalCapital: 0, totalInvestment: 0 };
          }
          const capitalBalance = t.capitalBalance || t.amount;
          const investmentBalance = t.investmentBalance || 0;
          groupedByMonth[monthKey].totalCapital += capitalBalance;
          groupedByMonth[monthKey].totalInvestment += investmentBalance;
          groupedByMonth[monthKey].transactions.push(t);
        });

        const sortedMonths = Object.keys(groupedByMonth).sort((a, b) => b.localeCompare(a));

        let html = '';
        
        sortedMonths.forEach(monthKey => {
          const monthGroup = groupedByMonth[monthKey];
          const investmentColor = monthGroup.totalInvestment >= 0 ? '#10b981' : '#ef4444';
          const investmentSign = monthGroup.totalInvestment >= 0 ? '+' : '';
          html += '<div class="month-section"><div class="month-header">' + monthGroup.label + ' <span style="font-weight: 400; color: #3b82f6;">资金总余额 ' + formatMoney(monthGroup.totalCapital) + '</span> <span style="font-weight: 400; color: ' + investmentColor + ';">理财总收益 ' + investmentSign + formatMoney(monthGroup.totalInvestment) + '</span></div>';
          
          monthGroup.transactions.forEach(t => {
            const capitalBalance = t.capitalBalance || t.amount;
            const investmentBalance = t.investmentBalance || 0;
            const investmentColor = investmentBalance >= 0 ? '#10b981' : '#ef4444';
            const investmentSign = investmentBalance >= 0 ? '+' : '';
            
            html += '<div class="transaction-item"><div class="transaction-info" onclick="openEditModal(' + t.id + ')"><div class="transaction-category">资金存放地：' + t.accountName + '</div><div class="transaction-description">💰 资金余额: ' + formatMoney(capitalBalance) + '</div><div style="font-size: 0.85rem; color: ' + investmentColor + ';">📈 理财收益: ' + investmentSign + formatMoney(investmentBalance) + '</div><div class="transaction-date">' + formatDate(t.date) + '</div></div><div style="display: flex; gap: 12px;"><div style="color: #667eea; cursor: pointer;">✏️ 修改</div><div style="color: #ef4444; cursor: pointer;" onclick="deleteTransaction(' + t.id + ')">🗑️ 删除</div></div></div>';
          });
          
          html += '</div>';
        });
        
        container.innerHTML = html;
      }
    }

    async function deleteTransaction(transactionId) {
      if (!confirm('确定要删除这条收入记录吗？此操作无法撤销。')) {
        return;
      }

      try {
        const response = await fetch(`/api/transactions/${transactionId}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          await refreshTransactions('all');
          await refreshSummary();
          await refreshFireInfo();
          alert('删除成功！');
        } else {
          alert('删除失败');
        }
      } catch (error) {
        alert('网络错误: ' + error.message);
      }
    }

    async function refreshFireInfo() {
      try {
        console.log('refreshFireInfo 开始执行');
        
        const transactions = await fetchData('/transactions');
        const incomeTransactions = transactions.filter(t => t.type === 'income');
        
        const monthlyData = {};
        incomeTransactions.forEach(t => {
          const date = new Date(t.date);
          const monthKey = date.getFullYear() + '-' + String(date.getMonth() + 1).padStart(2, '0');
          const capitalBalance = t.capitalBalance || t.amount || 0;
          const investmentBalance = t.investmentBalance || 0;
          
          if (!monthlyData[monthKey]) {
            monthlyData[monthKey] = { totalCapital: 0, totalInvestment: 0 };
          }
          monthlyData[monthKey].totalCapital += capitalBalance;
          monthlyData[monthKey].totalInvestment += investmentBalance;
        });
        
        const monthsAsc = Object.keys(monthlyData).sort((a, b) => a.localeCompare(b));
        const currentCapital = monthsAsc.length > 0 ? monthlyData[monthsAsc[monthsAsc.length - 1]].totalCapital : 0;
        
        const fireTarget = userAnnualExpense > 0 ? (userAnnualExpense / getReturnRate()) : 0;
        const remainingAmount = fireTarget - currentCapital;
        
        let annualSavings = 0;
        let annualRate = getReturnRate();
        const monthCount = monthsAsc.length;
        
        if (monthCount <= 1) {
          annualSavings = (userAnnualIncome || 0) - (userAnnualExpense || 0);
          annualRate = getReturnRate();
        } else if (monthCount >= 2 && monthCount <= 11) {
          let totalMonthlySavings = 0;
          for (let i = 1; i < monthsAsc.length; i++) {
            const currentMonth = monthsAsc[i];
            const prevMonth = monthsAsc[i - 1];
            const capitalChange = monthlyData[currentMonth].totalCapital - monthlyData[prevMonth].totalCapital;
            const investmentIncome = monthlyData[currentMonth].totalInvestment;
            totalMonthlySavings += capitalChange - investmentIncome;
          }
          annualSavings = (totalMonthlySavings / (monthCount - 1)) * 12;
          
          if (monthCount >= 3) {
            let product = 1;
            for (let i = 1; i < monthsAsc.length; i++) {
              const currentMonth = monthsAsc[i];
              const prevMonth = monthsAsc[i - 1];
              const rate = monthlyData[currentMonth].totalInvestment / monthlyData[prevMonth].totalCapital;
              product *= (1 + rate);
            }
            annualRate = Math.pow(product, 12 / (monthCount - 1)) - 1;
          }
        } else {
          const recent12MonthsAsc = monthsAsc.slice(-12);
          let totalMonthlySavings = 0;
          for (let i = 1; i < recent12MonthsAsc.length; i++) {
            const currentMonth = recent12MonthsAsc[i];
            const prevMonth = recent12MonthsAsc[i - 1];
            const capitalChange = monthlyData[currentMonth].totalCapital - monthlyData[prevMonth].totalCapital;
            const investmentIncome = monthlyData[currentMonth].totalInvestment;
            totalMonthlySavings += capitalChange - investmentIncome;
          }
          annualSavings = totalMonthlySavings;
          
          let product = 1;
          for (let i = 1; i < recent12MonthsAsc.length; i++) {
            const currentMonth = recent12MonthsAsc[i];
            const prevMonth = recent12MonthsAsc[i - 1];
            if (monthlyData[prevMonth].totalCapital > 0) {
              const rate = monthlyData[currentMonth].totalInvestment / monthlyData[prevMonth].totalCapital;
              product *= (1 + rate);
            }
          }
          annualRate = product - 1;
        }
        
        let yearsToFire = '--';
        if (fireTarget > 0 && currentCapital >= 0 && annualRate >= 0) {
          const A = currentCapital;
          const S = annualSavings;
          const r = annualRate;
          const F = fireTarget;
          
          if (r > 0 && S >= 0) {
            const numerator = Math.log((F * r + S) / (A * r + S));
            const denominator = Math.log(1 + r);
            if (denominator !== 0 && !isNaN(numerator) && !isNaN(denominator)) {
              yearsToFire = Math.max(0, numerator / denominator).toFixed(1);
            }
          } else if (S > 0 && r === 0) {
            yearsToFire = Math.max(0, (F - A) / S).toFixed(1);
          }
        }
        
        const progressPercentage = fireTarget > 0 ? Math.min(100, (currentCapital / fireTarget * 100)).toFixed(1) : 0;
        
        const fireTargetInWan = (fireTarget / 10000).toFixed(2);
        const remainingInWan = (remainingAmount / 10000).toFixed(2);
        
        const fireTargetEl = document.getElementById('fire-target');
        const firePercentageEl = document.getElementById('fire-percentage');
        const fireProgressEl = document.getElementById('fire-progress');
        const fireRemainingEl = document.getElementById('fire-remaining');
        const yearsText = document.getElementById('fire-years');
        
        if (fireTargetEl) fireTargetEl.textContent = `¥ ${fireTargetInWan}（万元）`;
        if (firePercentageEl) firePercentageEl.textContent = progressPercentage + '%';
        if (fireProgressEl) fireProgressEl.style.width = progressPercentage + '%';
        if (fireRemainingEl) fireRemainingEl.textContent = `距离 FIRE 还需: ¥ ${remainingInWan}（万元）`;
        
        if (yearsText) {
          if (remainingAmount <= 0) {
            yearsText.innerHTML = '🎉 <span style="font-size: 1.4rem;">已达成</span> FIRE 目标！';
          } else if (yearsToFire === '--' || parseFloat(yearsToFire) >= 100) {
            yearsText.innerHTML = '还需 <span style="font-size: 1.4rem;">--</span> 年实现 FIRE';
          } else {
            yearsText.innerHTML = `还需 <span style="font-size: 1.4rem;">${yearsToFire}</span> 年实现 FIRE`;
          }
        }
        
        console.log('refreshFireInfo 执行完成');
      } catch (error) {
        console.error('refreshFireInfo 执行失败:', error);
        alert('刷新 FIRE 信息失败: ' + error.message);
      }
    }

    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        
        // 只在全部收入标签页显示添加记录按钮
        const addBtn = document.querySelector('.btn-add');
        if (tab.dataset.tab === 'all') {
          addBtn.style.display = 'block';
        } else {
          addBtn.style.display = 'none';
        }
        
        refreshTransactions(tab.dataset.tab);
      });
    });

    let editingAccountId = null;

    function openUserInfoModal() {
      document.getElementById('edit-annual-income').value = userAnnualIncome ? (userAnnualIncome / 10000).toFixed(1) : '';
      document.getElementById('edit-annual-expense').value = userAnnualExpense ? (userAnnualExpense / 10000).toFixed(1) : '';
      document.getElementById('edit-risk-profile').value = userRiskProfile || '';
      
      document.getElementById('user-info-modal').classList.add('active');
    }

    function closeUserInfoModal() {
      const modal = document.getElementById('user-info-modal');
      if (modal) {
        modal.classList.remove('active');
        console.log('用户信息模态框已关闭');
      } else {
        console.error('用户信息模态框未找到');
      }
    }

    window.saveUserInfoEdit = async function() {
      try {
        const annualIncome = parseFloat(document.getElementById('edit-annual-income').value);
        if (!annualIncome || annualIncome <= 0) {
          alert('请输入有效的家庭年收入（大于0）');
          return;
        }
        
        const annualExpense = parseFloat(document.getElementById('edit-annual-expense').value);
        if (!annualExpense || annualExpense < 0) {
          alert('请输入有效的家庭年支出（大于等于0）');
          return;
        }
        
        const riskProfile = document.getElementById('edit-risk-profile').value;
        if (!riskProfile) {
          alert('请选择您的家庭理财情况');
          return;
        }
        
        userAnnualIncome = annualIncome * 10000;
        userAnnualExpense = annualExpense * 10000;
        userRiskProfile = riskProfile;
        
        const userInfo = { 
          gender: userGender,
          annualIncome: userAnnualIncome,
          annualExpense: userAnnualExpense,
          riskProfile: userRiskProfile
        };
        localStorage.setItem('userInfo', JSON.stringify(userInfo));
        
        closeUserInfoModal();
        await refreshFireInfo();
        alert('个人信息已更新！');
      } catch (error) {
        console.error('保存个人信息失败:', error);
        alert('保存个人信息失败: ' + error.message);
      }
    };

    function openDepositListModal() {
      refreshDepositAccounts();
      document.getElementById('deposit-list-modal').classList.add('active');
    }

    function closeDepositListModal() {
      document.getElementById('deposit-list-modal').classList.remove('active');
    }

    async function refreshDepositAccounts() {
      const accounts = await fetchData('/deposit-accounts');
      const container = document.getElementById('deposit-list');
      
      const depositSelect = document.getElementById('deposit-account-select');
      depositSelect.innerHTML = '<option value="">请选择资金存放地</option>' + 
        accounts.map(a => `<option value="${a.id}">${a.name}</option>`).join('');

      if (accounts.length === 0) {
        container.innerHTML = '<div class="empty-state"><p>暂无资金账户，请添加</p></div>';
        return;
      }

      container.innerHTML = accounts.map(account => `
        <div class="deposit-item">
          <div class="deposit-info">
            <div class="deposit-name">${account.name}</div>
            <div class="deposit-type">${getDepositTypeLabel(account.type)}</div>
          </div>
          <div class="deposit-repayment">
            ${account.type === 'bank' ? (account.repaymentDay ? `还款日: ${account.repaymentDay}日` : '<span style="color: #f97316;">未设置还款日</span>') : '-'}
          </div>
          <div class="deposit-actions">
            ${account.type === 'bank' ? `<button onclick="openRepaymentModal(${account.id}, ${account.repaymentDay || 1})">修改还款日</button>` : ''}
            <button onclick="deleteDepositAccount(${account.id})">删除</button>
          </div>
        </div>
      `).join('');
    }

    function getDepositTypeLabel(type) {
      const labels = {
        bank: '🏦 还款账户',
        other: '💼 普通账户',
        alipay: '📱 支付宝',
        jd: '🛒 京东金融',
        wechat: '💬 微信余额',
        securities: '📈 证券公司'
      };
      return labels[type] || type;
    }

    function openDepositModal() {
      document.getElementById('deposit-name-input').value = '';
      document.getElementById('deposit-repayment-select').value = 'no';
      document.getElementById('repayment-day-group').style.display = 'none';
      
      const modal = document.getElementById('deposit-modal');
      if (modal) {
        modal.classList.add('active');
      }
    }

    function toggleRepaymentDay() {
      const select = document.getElementById('deposit-repayment-select');
      const group = document.getElementById('repayment-day-group');
      
      if (select.value === 'yes') {
        group.style.display = 'block';
      } else {
        group.style.display = 'none';
      }
    }

    function closeDepositModal() {
      document.getElementById('deposit-modal').classList.remove('active');
    }

    async function submitDepositAccount() {
      try {
        const nameInput = document.getElementById('deposit-name-input');
        const repaymentSelect = document.getElementById('deposit-repayment-select');
        const repaymentInput = document.getElementById('repayment-day-input');
        
        if (!nameInput || !repaymentSelect || !repaymentInput) {
          console.error('Form elements not found');
          alert('表单元素未找到');
          return;
        }
        
        const name = nameInput.value.trim();
        const isRepayment = repaymentSelect.value === 'yes';
        const repaymentDay = isRepayment ? parseInt(repaymentInput.value) : undefined;

        if (!name) {
          alert('请输入账户名称');
          return;
        }

        if (isRepayment && (!repaymentDay || repaymentDay < 1 || repaymentDay > 31)) {
          alert('请输入有效的还款日（1-31）');
          return;
        }

        const postData = { 
          name, 
          type: isRepayment ? 'bank' : 'other',
          repaymentDay 
        };
        
        console.log('Submitting deposit account:', postData);

        const response = await fetch('/api/deposit-accounts', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(postData)
        });

        console.log('Response status:', response.status);
        
        if (response.ok) {
          const result = await response.json();
          console.log('Account added:', result);
          closeDepositModal();
          await refreshDepositAccounts();
          alert('账户添加成功！');
        } else {
          let errorMessage = '添加失败';
          try {
            const data = await response.json();
            errorMessage = data.error || '添加失败';
          } catch (e) {
            errorMessage = `HTTP错误: ${response.status}`;
          }
          console.error('Error adding account:', errorMessage);
          alert(errorMessage);
        }
      } catch (error) {
        console.error('Error submitting deposit account:', error);
        alert('网络错误: ' + error.message);
      }
    }

    function openRepaymentModal(accountId, currentDay) {
      editingAccountId = accountId;
      document.getElementById('edit-repayment-day').value = currentDay;
      document.getElementById('repayment-modal').classList.add('active');
    }

    function closeRepaymentModal() {
      editingAccountId = null;
      document.getElementById('repayment-modal').classList.remove('active');
    }

    async function submitRepaymentDay() {
      const day = parseInt(document.getElementById('edit-repayment-day').value);
      
      if (!day || day < 1 || day > 31) {
        alert('请输入有效的还款日（1-31）');
        return;
      }

      try {
        const response = await fetch(`/api/deposit-accounts/${editingAccountId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ repaymentDay: day })
        });

        if (response.ok) {
          closeRepaymentModal();
          await refreshDepositAccounts();
        } else {
          alert('修改失败');
        }
      } catch (error) {
        alert('网络错误');
      }
    }

    async function deleteDepositAccount(id) {
      if (!confirm('确定要删除这个账户吗？')) {
        return;
      }

      try {
        const response = await fetch(`/api/deposit-accounts/${id}`, {
          method: 'DELETE'
        });

        if (response.ok) {
          await refreshDepositAccounts();
        } else {
          alert('删除失败');
        }
      } catch (error) {
        alert('网络错误');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const hasUserInfo = getUserInfo();
      if (hasUserInfo) {
        document.getElementById('welcome-modal').style.display = 'none';
        refreshData();
      } else {
        document.getElementById('gender-male').style.borderColor = '#667eea';
      }
      
      document.addEventListener('click', (event) => {
        const target = event.target;
        const transactionItem = target.closest('.transaction-item');
        if (transactionItem) {
          const idMatch = transactionItem.getAttribute('onclick')?.match(/openEditModal\((\d+)\)/);
          if (idMatch) {
            const transactionId = parseInt(idMatch[1]);
            console.log('修改按钮被点击，交易ID:', transactionId);
            window.openEditModal(transactionId);
          }
        }
      });
    });
  </script>
